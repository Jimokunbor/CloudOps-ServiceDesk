services:

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile

    container_name: cloudops-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery:
    build:
      context: .
      dockerfile: docker/app/Dockerfile

    container_name: cloudops-celery

    command: celery -A app.celery.celery_app worker --loglevel=info

    env_file:
      - .env

    depends_on:
      - redis

    volumes:
      - .:/app

    restart: unless-stopped

  postgres:
    image: postgres:17

    container_name: cloudops-postgres

    env_file:
      - docker/postgres/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  redis:
    image: redis:7

    container_name: cloudops-redis

    command: redis-server /usr/local/etc/redis/redis.conf

    ports:
      - "6379:6379"

    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data

    restart: unless-stopped

  nginx:
    image: nginx:latest

    container_name: cloudops-nginx

    depends_on:
      - app

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: